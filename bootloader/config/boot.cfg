# DIT-OS Bootloader Configuration File
# Version 1.0

# Global settings
TIMEOUT=5
DEFAULT=0

# Boot entries
ENTRY "DIT OS" {
    KERNEL /boot/kernel.bin
    CMDLINE "root=/dev/sda1 quiet"
}

ENTRY "DIT OS (Debug Mode)" {
    KERNEL /boot/kernel.bin
    CMDLINE "root=/dev/sda1 debug loglevel=7"
}

ENTRY "Recovery Mode" {
    KERNEL /boot/recovery.bin
    CMDLINE "single"
}
