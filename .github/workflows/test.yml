name: Test

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential make nasm qemu-system-x86 xxd

      - name: Clean and build
        run: |
          rm -rf bootloader/build kernel/build
          make -C kernel -j"$(nproc)"
          make -C bootloader all

      - name: Run QEMU boot smoke test
        run: |
          set -euo pipefail
          (sleep 3; printf "1\n"; sleep 6; printf "echo OK\n"; sleep 2; \
           printf "exit\n"; sleep 2) | \
            timeout 35 qemu-system-i386 \
            -accel tcg,thread=single \
            -drive format=raw,file=bootloader/build/disk.img,index=0,if=floppy \
            -display none -serial mon:stdio -no-reboot -m 32M 2>&1 | \
            tee /tmp/smoke-output.log

          echo "=== Smoke test checks ==="
          grep -q "DIT-OS Kernel" /tmp/smoke-output.log && echo "PASS: Kernel started" || {
            echo "FAIL: Kernel did not start"
            cat /tmp/smoke-output.log
            exit 1
          }
          grep -q "user@dit" /tmp/smoke-output.log && echo "PASS: Shell prompt visible" || {
            echo "FAIL: Shell prompt not found"
            cat /tmp/smoke-output.log
            exit 1
          }
          grep -q "OK" /tmp/smoke-output.log && echo "PASS: Echo command executed" || {
            echo "FAIL: Echo command failed"
            cat /tmp/smoke-output.log
            exit 1
          }
          echo "=== Smoke test passed ==="


