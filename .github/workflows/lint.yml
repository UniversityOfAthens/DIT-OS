name: Lint

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Pinned so CI and developers agree; `pipx run clang-format==<ver>` locally.
  CLANG_FORMAT_VERSION: "20.1.8"

jobs:
  clang-format:
    name: clang-format
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Check C/C++ formatting
        run: |
          set -euo pipefail
          mapfile -t sources < <(git ls-files \
            'kernel/*.cpp' 'kernel/*.hpp' 'kernel/*.c' 'kernel/*.h' \
            'bootloader/*.cpp' 'bootloader/*.hpp' \
            'userland/*.c' 'userland/*.h')
          pipx run "clang-format==${CLANG_FORMAT_VERSION}" --version
          pipx run "clang-format==${CLANG_FORMAT_VERSION}" \
            --dry-run -Werror "${sources[@]}"

  cppcheck:
    name: cppcheck
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Install cppcheck
        run: sudo apt-get update && sudo apt-get install -y cppcheck

      - name: Static analysis gate
        run: scripts/cppcheck.sh

  shellcheck:
    name: shellcheck
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - name: Lint shell scripts
        run: |
          set -euo pipefail
          mapfile -t scripts < <(git ls-files '*.sh')
          shellcheck --version
          shellcheck -S style "${scripts[@]}"
          # AGENTS.md: every script uses strict mode
          missing=0
          for f in "${scripts[@]}"; do
            grep -q '^set -euo pipefail$' "$f" \
              || { echo "::error file=$f::missing 'set -euo pipefail'"; missing=1; }
          done
          exit "$missing"

  conventions:
    name: Source conventions
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - name: NASM files declare BITS
        run: |
          set -euo pipefail
          # Only files the build assembles; the other bootloader/src/stage2
          # and uefi modules are dead code (ISSUES.md H18).
          mapfile -t files < <(git ls-files 'kernel/*.asm' \
            bootloader/src/stage1/stage1.asm \
            bootloader/src/stage2/stage2.asm \
            bootloader/src/loader/loader.asm)
          bad=0
          for f in "${files[@]}"; do
            grep -qiE '^\s*\[?bits\s+(16|32|64)\]?' "$f" \
              || { echo "::error file=$f::missing BITS 16/32 directive"; bad=1; }
          done
          exit "$bad"

      - name: No '#pragma once'
        run: |
          if git grep -n '#pragma once' -- '*.hpp' '*.h'; then
            echo "::error::use #ifndef include guards (AGENTS.md)"
            exit 1
          fi

      - name: No trailing whitespace, final newline present
        run: |
          set -euo pipefail
          bad=0
          if git grep -nIE '[[:space:]]+$' -- ':!boot/grub/grubenv'; then
            echo "::error::trailing whitespace (lines above)"
            bad=1
          fi
          while IFS= read -r f; do
            [ -s "$f" ] || continue
            grep -Iq . "$f" || continue # skip binary files
            if [ -n "$(tail -c 1 "$f")" ]; then
              echo "::error file=$f::missing final newline"
              bad=1
            fi
          done < <(git ls-files ':!boot/grub/grubenv')
          exit "$bad"

      - name: Syscall numbers match between kernel and userland
        run: |
          set -euo pipefail
          # Every SYS_x the userland header defines must have the same
          # number in the kernel enum.
          bad=0
          while read -r name num; do
            knum="$(grep -oE "\b${name} = [0-9]+" \
              kernel/include/syscall/syscall_numbers.hpp | grep -oE '[0-9]+$' || true)"
            if [ "$knum" != "$num" ]; then
              echo "::error::$name is $num in userland but '${knum:-missing}' in kernel"
              bad=1
            fi
          done < <(awk '/^#define SYS_/ { print $2, $3 }' userland/include/syscall.h)
          exit "$bad"

  actionlint:
    name: actionlint
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - name: Lint GitHub workflows
        run: |
          bash <(curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.12/scripts/download-actionlint.bash) 1.7.12
          ./actionlint -color
