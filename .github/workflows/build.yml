name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential make nasm qemu-system-x86

      - name: Build kernel
        run: make -C kernel -j"$(nproc)"

      - name: Build bootloader disk image
        run: make -C bootloader all

      - name: QEMU smoke boot (menu -> boot option 1)
        run: |
          set -euo pipefail
          # Select "Boot DIT-OS", then ask shell to exit so QEMU powers off.
          (printf "1\n"; sleep 5; printf "exit\n"; sleep 1) | timeout 30 make -C bootloader run