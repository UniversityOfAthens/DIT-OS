name: Build

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential make nasm qemu-system-x86 xxd

      - name: Clean build artifacts
        run: |
          rm -rf bootloader/build kernel/build

      - name: Build kernel
        run: make -C kernel -j"$(nproc)"

      - name: Build bootloader disk image
        run: make -C bootloader all

      - name: Verify disk image integrity
        run: |
          set -euo pipefail
          # Check MBR signature (0x55 0xAA at offset 0x1FE)
          echo "MBR signature:"
          xxd -s 0x1FE -l 2 bootloader/build/disk.img
          [ "$(xxd -s 0x1FE -l 2 -p bootloader/build/disk.img)" = "55aa" ] || {
            echo "ERROR: Missing MBR signature 0xAA55"
            exit 1
          }
          # Verify stage2 loaded at sector 2
          echo "Stage2 at sector 2: $(xxd -s $((2*512)) -l 4 -p bootloader/build/disk.img)"
          # Verify kernel at sector 37
          echo "Kernel ELF magic at sector 37: $(xxd -s $((37*512)) -l 4 -p bootloader/build/disk.img)"
          [ "$(xxd -s $((37*512)) -l 4 -p bootloader/build/disk.img)" = "7f454c46" ] || {
            echo "ERROR: Kernel ELF magic not found at sector 37"
            exit 1
          }

      - name: QEMU smoke test (boot → shell → echo → exit)
        run: |
          set -euo pipefail
          # Boot sequence: select menu option 1, wait for shell, run echo, exit
          (sleep 3; printf "1\n"; sleep 6; printf "echo HELLO\n"; sleep 2; \
           printf "exit\n"; sleep 2) | \
            timeout 35 qemu-system-i386 \
            -accel tcg,thread=single \
            -drive format=raw,file=bootloader/build/disk.img,index=0,if=floppy \
            -display none -serial mon:stdio -no-reboot -m 32M 2>&1 | \
            tee /tmp/qemu-output.log

          echo "=== Smoke test checks ==="
          grep -q "DIT-OS Kernel" /tmp/qemu-output.log && echo "PASS: Kernel started" || {
            echo "FAIL: Kernel did not start"
            cat /tmp/qemu-output.log
            exit 1
          }
          grep -q "HELLO" /tmp/qemu-output.log && echo "PASS: Shell processed echo command" || {
            echo "FAIL: Shell did not process command"
            cat /tmp/qemu-output.log
            exit 1
          }
          grep -q "Bye" /tmp/qemu-output.log && echo "PASS: Shell exit succeeded" || {
            echo "FAIL: Shell did not exit cleanly"
            cat /tmp/qemu-output.log
            exit 1
          }
          echo "=== QEMU smoke test PASSED ==="
