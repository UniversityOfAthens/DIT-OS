name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build, test and publish
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential nasm qemu-system-x86

      - name: Build (clean)
        run: |
          rm -rf kernel/build bootloader/build
          make -C kernel -j"$(nproc)"
          make -C bootloader all

      - name: QEMU integration test
        env:
          QEMU_TEST_TIMEOUT: "60"
        run: scripts/qemu-test.sh

      - name: Release notes from CHANGELOG.md
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if ! grep -q '[^[:space:]]' release-notes.md; then
            echo "::error::CHANGELOG.md has no section for [$version]"
            exit 1
          fi
          cat release-notes.md

      - name: Package artifacts
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p release
          cp bootloader/build/disk.img "release/DIT-OS-${TAG}.img"
          cp bootloader/build/kernel.bin "release/DIT-OS-${TAG}-kernel.elf"
          cp bootloader/build/stage1.bin bootloader/build/stage2.bin \
             bootloader/build/loader.bin release/
          (cd release && sha256sum -- * > SHA256SUMS)
          cat release/SHA256SUMS

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: DIT-OS ${{ github.ref_name }}
          body_path: release-notes.md
          # 0.x-alpha style tags are pre-releases
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: release/*
